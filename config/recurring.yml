production:
  daily_sync:
    class: DailySyncJob
    schedule: every day at 6am
  recurring_billing:
    class: RecurringBillingJob
    schedule: every day at 7am
  usage_sync:
    class: UsageSyncJob
    schedule: every day at 6am
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

development:
  daily_sync:
    class: DailySyncJob
    schedule: every day at 6am
  recurring_billing:
    class: RecurringBillingJob
    schedule: every day at 7am
  usage_sync:
    class: UsageSyncJob
    schedule: every day at 6am
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
